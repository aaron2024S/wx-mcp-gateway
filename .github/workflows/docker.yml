name: 构建并推送镜像

# 什么时候构建：
#   · 推 v* 标签（发版）—— 自动
#   · 手动 Run workflow —— 可以指定标签，留空则读 package.json 的版本号
#
# 推 main 不构建：这个项目零第三方依赖、改一行就能跑，每次 push 都编译纯属浪费额度。
# 想让某次改动出镜像，就在 Actions 页点一次 Run workflow。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空 = 用 package.json 里的版本号）'
        required: false
        default: ''
        type: string

env:
  IMAGE_NAME: wx-mcp-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # 出镜像之前先跑一遍端到端测试：起假 iLink 网关 + 假 MCP server，
      # 41 项断言覆盖扫码→收消息→匹配→执行→二次确认→解绑重扫。
      # 这一步能挡住"字段名写错一个字母"这类只在真机上才暴露的问题。
      - name: 跑端到端测试
        run: |
          node --version
          npm test
          npm run test:llm

      - name: 计算镜像标签
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DH_USER:-}" ]; then
            echo "::error::仓库里没有 DOCKERHUB_USERNAME 这个 secret。到 Settings → Secrets and variables → Actions → Secrets 分页里添加（不是 Variables 分页）。"
            exit 1
          fi
          USER_LOWER="$(printf '%s' "$DH_USER" | tr '[:upper:]' '[:lower:]')"

          if [ "$REF_TYPE" = "tag" ]; then
            VER="${REF_NAME#v}"
          elif [ -n "${INPUT_TAG:-}" ]; then
            VER="${INPUT_TAG#v}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi

          if [ -z "$VER" ] || [ "$VER" = "latest" ]; then
            TAGS="${USER_LOWER}/${IMAGE_NAME}:latest"
          else
            TAGS="${USER_LOWER}/${IMAGE_NAME}:${VER},${USER_LOWER}/${IMAGE_NAME}:latest"
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=${USER_LOWER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "将推送：$TAGS"

      # 产物是纯 JS + node:22-alpine，与 CPU 架构无关，但 arm64 那个基础镜像
      # 里仍有 mkdir/chown 两条 RUN 要在 arm64 环境下执行，所以还是需要 QEMU。
      # 代价很小：没有编译、没有 npm install，两条命令都是毫秒级。
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          # Intel/AMD 的 NAS 与 ARM 的群晖都能用
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=wx-mcp-gateway
            org.opencontainers.image.description=用微信控制任意 MCP server 的网关
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          # mode=min 只导出最终层。mode=max 会把全部中间层也上传，
          # 遇到大层时单是"导出缓存"就能吃掉十几分钟。
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 写入运行摘要
        run: |
          {
            echo "### 镜像已推送"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\` |"
            echo "| 别名 | \`${{ steps.meta.outputs.image }}:latest\` |"
            echo "| 架构 | linux/amd64, linux/arm64 |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo
            echo "拉取："
            echo
            echo '```'
            echo "docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo '```'
            echo
            echo "> 镜像详情里若看到 \`unknown/unknown\` 那一条，是构建证明（provenance）清单，不是多出来的架构。"
          } >> "$GITHUB_STEP_SUMMARY"
