name: 构建并推送镜像

# 什么时候构建：
#   · 推 v* 标签（发版）—— 自动
#   · 手动 Run workflow —— 可以指定标签，留空则读 package.json 的版本号
#
# 推 main 不构建：这个项目零第三方依赖、改一行就能跑，每次 push 都编译纯属浪费额度。
# 想让某次改动出镜像，就在 Actions 页点一次 Run workflow。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（留空 = 用 package.json 里的版本号）'
        required: false
        default: ''
        type: string

env:
  IMAGE_NAME: wx-mcp-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # 出镜像之前先跑一遍测试：
      #   e2e    —— 假 iLink 网关 + 假 MCP server，83 项；
      #   auth   —— 起真服务走完设密码→登录→改密→锁定，56 项；
      #   llm    —— 假 OpenAI/Anthropic 端点 + 模型清单 + 四档 llm_when + 工具名转义，46 项；
      #   store  —— 配置/密钥三层合并顺序，40 项（权限位只在 Linux 上真校验）。
      # 这一步能挡住"字段名写错一个字母"这类只在真机上才暴露的问题。
      - name: 跑测试
        run: |
          node --version
          npm test
          npm run test:auth
          npm run test:llm
          npm run test:store

      - name: 计算镜像标签
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DH_USER:-}" ]; then
            echo "::error::仓库里没有 DOCKERHUB_USERNAME 这个 secret。到 Settings → Secrets and variables → Actions → Secrets 分页里添加（不是 Variables 分页）。"
            exit 1
          fi
          USER_LOWER="$(printf '%s' "$DH_USER" | tr '[:upper:]' '[:lower:]')"

          if [ "$REF_TYPE" = "tag" ]; then
            VER="${REF_NAME#v}"
          elif [ -n "${INPUT_TAG:-}" ]; then
            VER="${INPUT_TAG#v}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi

          if [ -z "$VER" ] || [ "$VER" = "latest" ]; then
            TAGS="${USER_LOWER}/${IMAGE_NAME}:latest"
          else
            TAGS="${USER_LOWER}/${IMAGE_NAME}:${VER},${USER_LOWER}/${IMAGE_NAME}:latest"
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=${USER_LOWER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "将推送：$TAGS"

      # 产物是纯 JS + node:22-alpine，与 CPU 架构无关，但 arm64 那个基础镜像
      # 里仍有 mkdir/chown 两条 RUN 要在 arm64 环境下执行，所以还是需要 QEMU。
      # 代价很小：没有编译、没有 npm install，两条命令都是毫秒级。
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # 凭据体检。
      #
      # 这里刻意「不」把清理后的值写进 GITHUB_ENV 再让下一步读 —— 那条路走过，
      # 结果 curl -u 直接打 auth.docker.io 返回
      #   400 {"details":"malformed HTTP Authorization header"}
      # 而同一个值在这一步明明显示 36 位、前缀正确。值在跨 step 传递时被弄脏了。
      # 现在每个用到凭据的 step 都直接从 secret 取值、各自清理，互不依赖。
      #
      # 只输出长度、字符类别与指纹，不输出值本身。
      - name: 检查推送凭据
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -uo pipefail
          U="$(printf '%s' "${RAW_USER:-}" | tr -d '[:space:]')"
          T="$(printf '%s' "${RAW_TOKEN:-}" | tr -d '[:space:]')"

          echo "用户名长度 : ${#U}  指纹 $(printf '%s' "$U" | sha256sum | cut -c1-12)"
          echo "Token 长度 : ${#T}  指纹 $(printf '%s' "$T" | sha256sum | cut -c1-12)"

          case "$T" in
            dckr_pat_*) echo "Token 前缀 : dckr_pat_（Access Token，正确）" ;;
            '')         echo "Token 前缀 : 空" ;;
            *)          echo "Token 前缀 : 不是 dckr_pat_" ;;
          esac

          # 统计 [A-Za-z0-9_-] 之外的字符个数。正常的 PAT 这里是 0。
          bad="$(printf '%s' "$T" | LC_ALL=C tr -d 'A-Za-z0-9_-' | wc -c | tr -d ' ')"
          echo "非 [A-Za-z0-9_-] 字符数 : $bad"

          if [ "$U" != "${RAW_USER:-}" ] || [ "$T" != "${RAW_TOKEN:-}" ]; then
            echo "::warning::首尾有空白，已去掉"
          fi
          if [ "$bad" != "0" ]; then
            echo "::error::Token 里有 $bad 个不该出现的字符（只应含字母数字下划线和连字符）。请删掉 secret，回 Docker Hub 重新复制一份"
            exit 1
          fi
          if [ -z "$T" ]; then
            echo "::error::DOCKERHUB_TOKEN 是空的。到 Settings → Secrets and variables → Actions 的 Secrets 分页填写"
            exit 1
          fi
          echo "凭据体检通过"

      # 登录分两步，为了把两种完全不同的故障分开：
      #
      # 「malformed HTTP Authorization header」这个报错有两种成因，外观一模一样：
      #   ① 凭据真的无效；
      #   ② daemon 到 registry 的链路被干扰，响应里的 WWW-Authenticate 头不规范，
      #      daemon 解析失败——此时 token 完全没问题，重试往往就过。
      #
      # 先用 curl 直连 auth.docker.io 换票（不经过 daemon），就能确定是哪种：
      # 200 说明凭据有效、问题在链路；401 才是 token 真错了。
      - name: 登录 Docker Hub
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -uo pipefail

          # 再次从 secret 直接取值（不读 GITHUB_ENV），并在这里 trim。
          DH_USER="$(printf '%s' "${RAW_USER:-}" | tr -d '[:space:]')"
          DH_TOKEN="$(printf '%s' "${RAW_TOKEN:-}" | tr -d '[:space:]')"
          echo "登录用凭据指纹：$(printf '%s' "$DH_TOKEN" | sha256sum | cut -c1-12)（应与上一步一致）"

          # runner 镜像自带的 ~/.docker/config.json 里有个 index.docker.io 条目，
          # 先清掉，避免它带着旧 auth 干扰后面的 login 与 buildx 读取。
          if [ -f "$HOME/.docker/config.json" ]; then
            mv "$HOME/.docker/config.json" "$HOME/.docker/config.json.bak" || true
            echo "已移走预置的 docker 凭据"
          fi

          # 用 curl 直连 auth 服务换票，完全不经过 daemon。
          # 这一步能独立判定：凭据本身行不行，和 daemon 链路无关。
          code="$(curl -sS -o /tmp/auth.json -w '%{http_code}' \
            -u "${DH_USER}:${DH_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DH_USER}/${IMAGE_NAME}:pull,push" 2>/dev/null)"
          code="${code:-000}"
          echo "auth.docker.io 换票：HTTP $code"

          case "$code" in
            200)
              got="$(python3 -c "import json;print(len(json.load(open('/tmp/auth.json')).get('token','')))")"
              echo "  凭据有效（换到 token ${got} 字符）"
              ;;
            401)
              echo "::error::Docker Hub 判定凭据无效。去 hub.docker.com → Account settings → Personal access tokens 重新生成 Read & Write 的 token（别用登录密码）"
              exit 1
              ;;
            000)
              echo "::error::连不上 auth.docker.io，runner 网络异常，重跑一次即可"
              exit 1
              ;;
            400)
              echo "--- auth.docker.io 说 ---"
              cat /tmp/auth.json || true
              echo
              echo "::error::auth.docker.io 认为我们发出的 Basic 头不合法。这通常意味着 token 里有非 ASCII 字符。请删掉 secret 重新复制"
              exit 1
              ;;
            *)
              echo "::warning::意外响应 $code，继续尝试登录"
              head -c 200 /tmp/auth.json || true
              echo
              ;;
          esac

          ok=0
          for i in 1 2 3; do
            echo "第 $i 次 docker login ..."
            if printf '%s' "${DH_TOKEN}" | docker login docker.io -u "${DH_USER}" --password-stdin; then
              ok=1
              break
            fi
            if [ "$i" -lt 3 ]; then echo "失败，10 秒后重试"; sleep 10; fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::三次登录都失败。如果上面换票是 HTTP 200，说明 runner 到 registry-1.docker.io 的链路被干扰，过几分钟重跑即可，不是配置错"
            exit 1
          fi
          echo "登录成功"

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          # Intel/AMD 的 NAS 与 ARM 的群晖都能用
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=wx-mcp-gateway
            org.opencontainers.image.description=用微信控制任意 MCP server 的网关
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          # mode=min 只导出最终层。mode=max 会把全部中间层也上传，
          # 遇到大层时单是"导出缓存"就能吃掉十几分钟。
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: 写入运行摘要
        run: |
          {
            echo "### 镜像已推送"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\` |"
            echo "| 别名 | \`${{ steps.meta.outputs.image }}:latest\` |"
            echo "| 架构 | linux/amd64, linux/arm64 |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo
            echo "拉取："
            echo
            echo '```'
            echo "docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo '```'
            echo
            echo "> 镜像详情里若看到 \`unknown/unknown\` 那一条，是构建证明（provenance）清单，不是多出来的架构。"
          } >> "$GITHUB_STEP_SUMMARY"
